[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ntf-ai"
dynamic = ["version"]
description = "NTF-AI (ntf): phone notifications and replies for AI agents. Speaks the ntfy protocol."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Legitimate LLC", email = "info@legitimateapps.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["ntfy", "notifications", "push", "ai", "agents", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ntf-ai.app"
Documentation = "https://ntf-ai.app/docs/agents"
Source = "https://github.com/legitimate-apps/ntf-ai/tree/main/cli/ntf-ai"
Issues = "https://github.com/legitimate-apps/ntf-ai/issues"

[project.scripts]
ntf = "ntf_ai:main"
ntf-ai = "ntf_ai:main"

[tool.setuptools]
py-modules = ["ntf_ai"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "ntf_ai.VERSION" }
